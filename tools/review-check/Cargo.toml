[package]
name = "review-check"
version = "0.1.0"
edition = "2021"
publish = false

# standalone tool crate, outside the cpm-* workspace
[workspace]

[dependencies]
syn = { version = "2", features = ["full", "parsing", "printing", "extra-traits", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
