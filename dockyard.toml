# cpm-store's declaration, read on top of dockyard.base.toml: only what differs.

# A Rust workspace, driven from Mistral Vibe (no .claude/ here, so the harness is declared
# rather than detected).
[dockyard]
languages = ["rust"]
harnesses = ["vibe"]

# Repo perso (hors org Tetrixx-SG) : les workflows dockyard appellent les reusable
# workflows Tetrixx-SG/dock-yard + les secrets d'une GitHub App de l'org, tous 404
# depuis un compte perso. La CI est autonome dans .github/workflows/ci.yml (elle
# appelle directement scripts/ci/*.sh). On decline les workflows dockyard pour que
# `dockyard sync` ne les réintroduise pas.
decline = [
  "deny.toml",
  "scripts/ci/msrv-rust.sh",
  ".github/workflows/board.yml",
  ".github/workflows/brand-lint.yml",
  ".github/workflows/ci.yml",
  ".github/workflows/claude.yml",
  ".github/workflows/deploy.yml",
  ".github/workflows/pr-issue-link.yml",
  ".github/workflows/release.yml",
]

[[dependabot]]
ecosystem = "cargo"
group = "rust"

# Level A (platform). Diffère du standard dockyard sur trois points, because repo
# perso solo (Xeftax) avec CI autonome :
# - required-checks = les 6 jobs de .github/workflows/ci.yml (pas de job "verdict" dockyard) ;
# - required-reviews = 0 et code-owner-reviews = false (contributeur unique, pas de CODEOWNERS) ;
# - merge-queue = false (standard org ; inutile en solo).
# Pose sur GitHub : branch protection main (6 checks requis, enforce_admins, linear
# history, force-push et suppression bloques), allow_merge_commit=false,
# vulnerability-alerts on, automated-security-fixes non pause.
[platform]
required-checks = [
  "build",
  "test",
  "lint (fmt + clippy -D warnings)",
  "msrv (rust-version du workspace)",
  "security (cargo-deny, licences + advisories)",
  "secret scan (gitleaks, binaire vérifié par le script)",
]
required-reviews = 0
code-owner-reviews = false
merge-queue = false
