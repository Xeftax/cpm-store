# cpm-store's declaration, read on top of dockyard.base.toml: only what differs.

# 100% Rust repo, driven from Mistral Vibe. `languages = []`: dockyard.base.toml does
# not know "rust", and the empty list (a valid subset) switches off all py/ts
# (language-bound) checks and all received py/ts/node files at once.
[dockyard]
languages = []

# Personal repo (outside the Tetrixx-SG org): the dockyard workflows call the reusable
# Tetrixx-SG/dock-yard workflows + the secrets of an org GitHub App, all 404 from a
# personal account. CI is self-contained in .github/workflows/ci.yml (it calls
# scripts/ci/*.sh directly).
[dockyard.decline]
".github/workflows/" = "repo-specific: Tetrixx-SG/dock-yard reusable workflows + org App secrets unreachable from a personal account (404); self-contained CI in .github/workflows/ci.yml"
".pre-commit-config.yaml" = "repo-specific: homegrown rust hooks (lint-rust, security-rust) unknown to the 2g rendering"
"scripts/ci/version-bump*" = "repo-specific: generic node tool, useless in a 100% Rust repo"

# Repo-owned files (level 4), with reason (dockyard.base.toml contract).
[dockyard.own]
"Cargo.toml" = "repo-specific: Rust workspace (MSRV 1.85, edition 2024)"
"deny.toml" = "repo-specific: cargo-deny pinned by hand for MSRV 1.85 (see commit history)"

[[dependabot]]
ecosystem = "cargo"
group = "rust"

# The whole repository belongs to Xeftax (solo personal repo). Declared here, rendered
# in .github/CODEOWNERS by `dockyard sync` — never edit the file by hand.
[[codeowner]]
path = "*"
owners = ["@Xeftax"]
comment = "Solo personal repo: the whole repository belongs to Xeftax."

# Level A (platform). Differs from the dockyard standard on three points, because it is
# a solo personal repo (Xeftax) with self-contained CI:
# - required-checks = the 6+ jobs of .github/workflows/ci.yml (no dockyard "verdict" job);
# - required-reviews = 0 and code-owner-reviews = false (single contributor: GitHub
#   forbids self-approval, so requiring a code-owner review would block everything);
# - merge-queue = false (org standard; useless solo).
# Set on GitHub: branch protection on main (required checks, enforce_admins, linear
# history, force-push and deletion blocked), allow_merge_commit=false,
# vulnerability-alerts on, automated-security-fixes enabled.
[platform]
required-checks = [
  "build",
  "test",
  "lint (fmt + clippy -D warnings)",
  "msrv (rust-version du workspace)",
  "security (cargo-deny, licences + advisories)",
  "secret scan (gitleaks, binaire vérifié par le script)",
  "commit-hygiene (no hook bypass in commits)",
  "language (English-only added lines)",
  "review-required (>=1 commit with a Reviewed-By trailer)",
]
# The python/markdown jobs (lint-python, typecheck-python, security-python,
# test-python, format-markdown) run on every PR but are not required: this repo is
# Rust-first (dockyard languages = []), they stay green as advisory checks.
# `review-owners` is informational (prints the owners triggered by the diff).
required-reviews = 0
code-owner-reviews = false
# Every PR needs a review commit (Reviewed-By trailer, enforced by the review-required
# CI job) AND GitHub's "require approval of the most recent reviewable push"
# (last-push-approval). Apply with the dockyard:platform-check skill.
last-push-approval = true
merge-queue = false
