# cpm-store's declaration, read on top of dockyard.base.toml: only what differs.

# Repo 100% Rust, drive depuis Mistral Vibe. `languages = []` : dockyard.base.toml ne
# connait pas "rust", et la liste vide (sous-ensemble valide) eteint d'un coup tous
# les checks py/ts (language-bound) et tous les fichiers recus py/ts/node.
[dockyard]
languages = []

# Repo perso (hors org Tetrixx-SG) : les workflows dockyard appellent les reusable
# workflows Tetrixx-SG/dock-yard + les secrets d'une GitHub App de l'org, tous 404
# depuis un compte perso. La CI est autonome dans .github/workflows/ci.yml (elle
# appelle directement scripts/ci/*.sh).
[dockyard.decline]
".github/workflows/" = "repo-specific: reusable workflows Tetrixx-SG/dock-yard + secrets App org inaccessibles depuis un compte perso (404) ; CI autonome dans .github/workflows/ci.yml"
".pre-commit-config.yaml" = "repo-specific: hooks rust maison (lint-rust, security-rust) que le rendu 2g ne connait pas"
"scripts/ci/version-bump*" = "repo-specific: outil node generique, inutile en repo 100% Rust"

# Fichiers propres au repo (level 4), avec raison (contrat de dockyard.base.toml).
[dockyard.own]
"Cargo.toml" = "repo-specific: workspace Rust (MSRV 1.85, edition 2024)"
"deny.toml" = "repo-specific: cargo-deny pinne a la main pour le MSRV 1.85 (voir l'historique des commits)"

[[dependabot]]
ecosystem = "cargo"
group = "rust"

# Tout le dépôt appartient à Xeftax (repo perso solo). declare ici, rendu dans
# .github/CODEOWNERS par `dockyard sync` — jamais d'edit manuel du fichier.
[[codeowner]]
path = "*"
owners = ["@Xeftax"]
comment = "Repo perso solo : tout le dépôt appartient à Xeftax."

# Level A (platform). Diffère du standard dockyard sur trois points, because repo
# perso solo (Xeftax) avec CI autonome :
# - required-checks = les 6 jobs de .github/workflows/ci.yml (pas de job "verdict" dockyard) ;
# - required-reviews = 0 et code-owner-reviews = false (contributeur unique : GitHub
#   interdit l'auto-approve, donc exiger un code-owner review bloquerait tout) ;
# - merge-queue = false (standard org ; inutile en solo).
# Pose sur GitHub : branch protection main (6 checks requis, enforce_admins, linear
# history, force-push et suppression bloques), allow_merge_commit=false,
# vulnerability-alerts on, automated-security-fixes non pause.
[platform]
required-checks = [
  "build",
  "test",
  "lint (fmt + clippy -D warnings)",
  "msrv (rust-version du workspace)",
  "security (cargo-deny, licences + advisories)",
  "secret scan (gitleaks, binaire vérifié par le script)",
]
required-reviews = 0
code-owner-reviews = false
# Inutile avec required-reviews = 0 (GitHub remet le switch a false de toute facon).
last-push-approval = false
merge-queue = false
