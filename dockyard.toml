# cpm-store's declaration, read on top of dockyard.base.toml: only what differs.

# Repo 100% Rust, driven from Mistral Vibe. `languages = []`: dockyard.base.toml
# does not know "rust", and the empty list (a valid subset) turns off all the
# py/ts checks (language-bound) and all py/ts/node files it receives in one go.
[dockyard]
languages = []

# Personal repo (outside the Tetrixx-SG org): the dockyard workflows call the
# Tetrixx-SG/dock-yard reusable workflows + the secrets of a GitHub App of the org,
# all of which 404 from a personal account. CI is self-contained in
# .github/workflows/ci.yml (it calls scripts/ci/*.sh directly).
[dockyard.decline]
".github/workflows/" = "repo-specific: Tetrixx-SG/dock-yard reusable workflows + org App secrets unreachable from a personal account (404); CI is self-contained in .github/workflows/ci.yml"
".pre-commit-config.yaml" = "repo-specific: homegrown rust hooks (lint-rust, security-rust) that the 2g rendering does not know"
"scripts/ci/version-bump*" = "repo-specific: generic node tool, useless in a 100% Rust repo"

# Repo-specific files (level 4), with a reason (contract of dockyard.base.toml).
[dockyard.own]
"Cargo.toml" = "repo-specific: Rust workspace (MSRV 1.85, edition 2024)"
"deny.toml" = "repo-specific: cargo-deny pinned by hand for MSRV 1.85 (see the commit history)"

[[dependabot]]
ecosystem = "cargo"
group = "rust"

# The whole repository belongs to Xeftax (personal solo repo). Declared here, rendered to
# .github/CODEOWNERS by `dockyard sync` — never edit that file by hand.
[[codeowner]]
path = "*"
owners = ["@Xeftax"]
comment = "Personal solo repo: the whole repository belongs to Xeftax."

# Level A (platform). Differs from the dockyard standard on three points, because the
# personal solo repo (Xeftax) has self-contained CI:
# - required-checks = the 9 required jobs of .github/workflows/ci.yml (no dockyard "verdict" job);
# - required-reviews = 0 and code-owner-reviews = false (single contributor: GitHub
#   forbids self-approval, so requiring a code-owner review would block everything);
# - merge-queue = false (org standard; useless solo).
# Applied on GitHub: main branch protection (6 required checks, enforce_admins, linear
# history, force-push and deletion blocked), allow_merge_commit=false,
# vulnerability-alerts on, automated-security-fixes enabled.
[platform]
required-checks = [
  "build",
  "test",
  "lint (fmt + clippy -D warnings)",
  "msrv (rust-version du workspace)",
  "security (cargo-deny, licences + advisories)",
  "secret scan (gitleaks, binaire vérifié par le script)",
  "commit-hygiene (no hook bypass in commits)",
  "language (English-only added lines)",
  "review-required (>=1 commit with a Reviewed-By trailer)",
]
# The python/markdown jobs (lint-python, typecheck-python, security-python,
# test-python, format-markdown) run on every PR but are not required: this repo is
# Rust-first (dockyard languages = []), they stay green as advisory checks.
# `review-owners` is informational (prints the owners triggered by the diff).
required-reviews = 0
code-owner-reviews = false
# Every PR needs a review commit (Reviewed-By trailer, enforced by the review-required
# CI job) AND GitHub's "require approval of the most recent reviewable push"
# (last-push-approval). Apply with the dockyard:platform-check skill.
last-push-approval = true
merge-queue = false
