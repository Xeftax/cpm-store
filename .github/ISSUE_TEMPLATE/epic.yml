name: Epic
description: Large body of work spanning multiple sub-issues
title: "<descriptive title — no Epic: prefix>"
type: Task
labels: []
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One paragraph stating the intended outcome.
    validations:
      required: true
  - type: textarea
    id: why_now
    attributes:
      label: Why now
      description: Bullet points — strategic reason, blockers being unblocked, dependencies coming online.
    validations:
      required: true
  - type: textarea
    id: scope_in
    attributes:
      label: Scope — In
      description: Bullet list of what's explicitly included.
    validations:
      required: true
  - type: textarea
    id: scope_out
    attributes:
      label: Scope — Out
      description: Bullet list of what's explicitly excluded (and why if non-obvious).
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist — what does "done" look like?
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Links to design docs, related PRs, ADRs, planning notes.
  - type: markdown
    attributes:
      value: |
        ---
        **After creating:** add this epic to this repo's project board, set `Prio`/`Area` (and any other board fields that apply), and link sub-issues via the native Sub-issues field as you create them.
