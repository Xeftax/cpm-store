# CI autonome de cpm-store (repo perso Xeftax, hors org Tetrixx-SG).
#
# Remplace les workflows dockyard : ceux-ci appellent les reusable workflows
# Tetrixx-SG/dock-yard/.github/workflows/_*.yml@main + les secrets d'une GitHub App
# de l'org, tous inaccessibles depuis un compte perso (404) -> runs en failure avec
# 0 job. Ici les checks appellent directement scripts/ci/*.sh (déjà dans le repo).
# Les workflows dockyard sont déclarés en `decline` dans dockyard.toml pour que
# `dockyard sync` ne les réintroduise pas.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/ci/build-rust.sh

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/ci/test-rust.sh

  lint:
    name: lint (fmt + clippy -D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/ci/lint-rust.sh

  msrv:
    name: msrv (rust-version du workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # fournit rustup ; msrv-rust.sh installe lui-même le toolchain épinglé (1.85)
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/ci/msrv-rust.sh

  security:
    name: security (cargo-deny : licences + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-deny --locked
      - run: scripts/ci/security-rust.sh

  gitleaks:
    name: secret scan (gitleaks, binaire vérifié par le script)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/secret-scan.sh
