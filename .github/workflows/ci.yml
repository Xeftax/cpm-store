# CI autonome de cpm-store (repo perso Xeftax, hors org Tetrixx-SG).
#
# Remplace les workflows dockyard : ceux-ci appellent les reusable workflows
# Tetrixx-SG/dock-yard/.github/workflows/_*.yml@main + les secrets d'une GitHub App
# de l'org, tous inaccessibles depuis un compte perso (404) -> runs en failure avec
# 0 job. Ici les checks appellent directement scripts/ci/*.sh (déjà dans le repo).
# Les workflows dockyard sont déclarés en `decline` dans dockyard.toml pour que
# `dockyard sync` ne les réintroduise pas.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/ci/build-rust.sh

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/ci/test-rust.sh

  lint:
    name: lint (fmt + clippy -D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/ci/lint-rust.sh

  msrv:
    name: msrv (rust-version du workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # fournit rustup ; msrv-rust.sh installe lui-même le toolchain épinglé (1.85)
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/ci/msrv-rust.sh

  security:
    name: security (cargo-deny, licences + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-deny --locked
      - run: scripts/ci/security-rust.sh

  commit-hygiene:
    name: commit-hygiene (no hook bypass in commits)
    runs-on: ubuntu-latest
    steps:
      # full history: the scan covers the commit messages of the whole PR range
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: >-
          scripts/ci/check-commit-hygiene.sh
          "${{ github.event.pull_request.base.sha || 'origin/main' }}"
          "${{ github.event.pull_request.head.sha || 'HEAD' }}"

  language:
    name: language (English-only added lines)
    runs-on: ubuntu-latest
    steps:
      # full history: the scan covers the added lines of the whole PR range
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # check-language.py has a `uv run --script` shebang: uv and python must be installed
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: >-
          scripts/ci/check-language.py --check
          "${{ github.event.pull_request.base.sha || 'origin/main' }}"
          "${{ github.event.pull_request.head.sha || 'HEAD' }}"

  review-owners:
    name: review-owners (owners triggered by the diff, informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # review-owners.py has a `uv run --script` shebang: uv and python must be installed
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: >-
          scripts/ci/review-owners.py --check
          "${{ github.event.pull_request.base.sha || 'origin/main' }}"
          "${{ github.event.pull_request.head.sha || 'HEAD' }}"

  review-required:
    name: review-required (>=1 commit with a Reviewed-By trailer)
    runs-on: ubuntu-latest
    steps:
      # full history: the scan covers the commit messages of the whole PR range
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: >-
          scripts/ci/check-review-commit.sh
          "${{ github.event.pull_request.base.sha || 'origin/main' }}"
          "${{ github.event.pull_request.head.sha || 'HEAD' }}"

  gitleaks:
    name: secret scan (gitleaks, binaire vérifié par le script)
    runs-on: ubuntu-latest
    steps:
      # historique complet : secret-scan.sh scanne tous les commits
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/ci/secret-scan.sh

  # --- domaine python (dockyard) ---

  lint-python:
    name: lint-python (ruff check + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --all-extras --frozen
      - run: scripts/ci/lint-python.sh

  typecheck-python:
    name: typecheck-python (mypy strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --all-extras --frozen
      - run: scripts/ci/typecheck-python.sh

  security-python:
    name: security-python (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --all-extras --frozen
      - run: scripts/ci/sast-python.sh

  test-python:
    name: test-python (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --all-extras --frozen
      - run: scripts/ci/test-python.sh

  format-markdown:
    name: format-markdown (mdformat --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: git ls-files '*.md' | xargs scripts/ci/format-markdown.sh --check

  # --- standard PR tooling ---

  gitlint:
    name: gitlint (commit messages)
    runs-on: ubuntu-latest
    steps:
      # full history: gitlint lints the whole origin/main...HEAD range
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pip install gitlint==0.19.1
      - run: scripts/ci/gitlint.sh origin/main...HEAD

  actionlint:
    name: actionlint (workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pinned release, official installer
      - run: bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.7
      - run: ./actionlint -color

  codespell:
    name: codespell (docs typos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install codespell==2.4.3
      - run: git ls-files '*.md' | xargs codespell

  review-check-annotations:
    name: review-check (PR annotations, informational)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      # full history: review-check diffs against origin/main
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked --manifest-path tools/review-check/Cargo.toml
      # pinned release, official installer
      - run: curl -sSL https://raw.githubusercontent.com/reviewdog/reviewdog/master/install.sh | sh -s -- -b /usr/local/bin v0.20.3
      - env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # review-check always exits 0 (ADR 0001, warning only); -fail-on-error=false
        # keeps reviewdog informational too: annotations on PR lines, never a red job.
        run: >
          tools/review-check/target/release/review-check origin/main --format=gcc
          | reviewdog -efm '%f:%l:%c: %m' -filter-mode=added -reporter=github-pr-review -fail-on-error=false
