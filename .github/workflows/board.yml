# The project-board automation. The logic lives in dockyard's `_board.yml`, and the board
# logic it runs in connected-intelligence's `board-sync` skill — read them there.
#
# This file exists for the two things a called workflow cannot carry: its triggers and its
# grant. It is shipped to every repo and does nothing until the repo declares a board:
# a `[board]` table in its `dockyard.toml` setting `project_number` and `ledger_issue`. A
# repo that never wants one declines this file in `dockyard.toml`.
#
# Level A, not a file: `vars.BOARD_BOT_APP_ID` + `secrets.BOARD_BOT_PRIVATE_KEY` (the board
# bot, installed on the org with Projects read/write and PR write), `vars.GH_APP_ID` +
# `secrets.GH_APP_PRIVATE_KEY` (read on connected-intelligence), and
# `secrets.CLAUDE_CODE_OAUTH_TOKEN` for the weekly audit.
name: Board

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, reopened, edited, ready_for_review, converted_to_draft, closed]
  # Friday 06:00 UTC: the retroactive audit sweep.
  schedule:
    - cron: '0 6 * * 5'
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue to onboard. Empty runs the audit.'
        required: false
        type: string

# The floor, as in claude.yml: a job with no grant of its own gets nothing.
permissions: {}

# One run per issue or PR at a time; the audit never overlaps itself.
concurrency:
  group: board-${{ github.event.issue.number || github.event.pull_request.number || 'audit' }}
  cancel-in-progress: false

jobs:
  board:
    uses: Tetrixx-SG/dock-yard/.github/workflows/_board.yml@main
    # Every write goes through the board bot's own token, so the job token only reads the
    # tree. `id-token` is what claude-code-action needs to mint its OIDC token for the audit.
    permissions:
      contents: read
      id-token: write
    secrets:
      board_bot_private_key: ${{ secrets.BOARD_BOT_PRIVATE_KEY }}
      gh_app_private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
