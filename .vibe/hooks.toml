# Session hooks for Mistral Vibe — managed by dockyard
# Do not edit manually — the generated [[hooks]] block below is overwritten on every
# `dockyard sync` in a repo that receives this file. Add your own hooks in a
# `dockyard:keep:start <region>` … `dockyard:keep:end <region>` pair AFTER the generated
# block (the angle brackets are deliberate: a literal marker pair here would be a live
# region in a file that ships).
#
# The generated block is the Vibe counterpart of `.pre-commit-config.yaml`'s generated hooks:
# the same declaration (one entry per check with a non-off `pre-commit` mode in
# `dockyard.base.toml` + `dockyard.toml`), each entry running the check's script with
# `--hook` — the mode `scripts/ci/lib/hook-mode.sh` implements, which checks only what the
# session's tree has uncommitted and never exits 2. A check with a `language` carries a
# `[[ -x … ]] || exit 0` guard, so a repo that declined the script skips it silently; the
# secret scan deliberately has none.
#
# This file only ships the hooks dockyard owns. The rest of a Vibe setup — secret-guard,
# the plugin adapters, user-level hooks in ~/.vibe/hooks.toml — is not dockyard's, the way
# `.claude/` session configuration is not dockyard's either.
#
# Received only when the repo declares `vibe` in `[dockyard] harnesses` (or has a `.vibe/`
# directory dockyard detects).

[[hooks]]
name = "dockyard-lint-python"
type = "post_agent"
timeout = 300.0
command = "[[ -x scripts/ci/lint-python.sh ]] || exit 0; scripts/ci/lint-python.sh --hook"
description = "dockyard check `lint-python` in --hook mode (generated by dockyard sync)"

[[hooks]]
name = "dockyard-typecheck-python"
type = "post_agent"
timeout = 300.0
command = "[[ -x scripts/ci/typecheck-python.sh ]] || exit 0; scripts/ci/typecheck-python.sh --hook"
description = "dockyard check `typecheck-python` in --hook mode (generated by dockyard sync)"

[[hooks]]
name = "dockyard-security-python"
type = "post_agent"
timeout = 300.0
command = "[[ -x scripts/ci/sast-python.sh ]] || exit 0; scripts/ci/sast-python.sh --hook"
description = "dockyard check `security-python` in --hook mode (generated by dockyard sync)"

[[hooks]]
name = "dockyard-lint-rust"
type = "post_agent"
timeout = 300.0
command = "[[ -x scripts/ci/lint-rust.sh ]] || exit 0; scripts/ci/lint-rust.sh --hook"
description = "dockyard check `lint-rust` in --hook mode (generated by dockyard sync)"

[[hooks]]
name = "dockyard-security-rust"
type = "post_agent"
timeout = 300.0
command = "[[ -x scripts/ci/security-rust.sh ]] || exit 0; scripts/ci/security-rust.sh --hook"
description = "dockyard check `security-rust` in --hook mode (generated by dockyard sync)"

[[hooks]]
name = "dockyard-gitleaks"
type = "post_agent"
timeout = 300.0
command = "scripts/ci/secret-scan.sh --hook"
description = "dockyard check `gitleaks` in --hook mode (generated by dockyard sync)"

[[hooks]]
name = "dockyard-skill-frontmatter"
type = "post_agent"
timeout = 300.0
command = "scripts/ci/check_skill_frontmatter.py --hook"
description = "dockyard check `skill-frontmatter` in --hook mode (generated by dockyard sync)"



# dockyard:keep:start cpm-store-local-hooks
# Repo-local session hooks (English-only rule + review owners), see AGENTS.md.

# Message on every write_file/edit whose content adds French/accented text.
[[hooks]]
name = "language-pre-write"
type = "pre_tool"
match = "re:.*(write_file|edit|notebook).*"
strict = false
timeout = 30.0
command = "[[ -x scripts/ci/check-language.py ]] || exit 0; scripts/ci/check-language.py --pre-write"
description = "Warn when a write adds accented/French text (repo rule: English-only content)"

# Warn (never block) on French/accented characters in uncommitted changes.
[[hooks]]
name = "language-post-agent"
type = "post_agent"
timeout = 60.0
command = "[[ -x scripts/ci/check-language.py ]] || exit 0; scripts/ci/check-language.py --hook"
description = "check-language on uncommitted changes (--hook mode, never blocks)"

# Print the review owners (.vibe/skills/) triggered by the uncommitted changes.
[[hooks]]
name = "review-owners"
type = "post_agent"
timeout = 30.0
command = "[[ -x scripts/ci/review-owners.py ]] || exit 0; scripts/ci/review-owners.py --hook"
description = "Print the review owners triggered by the current diff (map: .vibe/review/owners-map.toml)"
# dockyard:keep:end cpm-store-local-hooks
