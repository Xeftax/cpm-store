# Session hooks for Mistral Vibe — managed by dockyard
# Do not edit manually — the generated [[hooks]] block below is overwritten on every
# `dockyard sync` in a repo that receives this file. Add your own hooks in a
# `dockyard:keep:start <region>` … `dockyard:keep:end <region>` pair AFTER the generated
# block (the angle brackets are deliberate: a literal marker pair here would be a live
# region in a file that ships).
#
# The generated block is the Vibe counterpart of `.pre-commit-config.yaml`'s generated hooks:
# the same declaration (one entry per check with a non-off `pre-commit` mode in
# `dockyard.base.toml` + `dockyard.toml`), each entry running the check's script with
# `--hook` — the mode `scripts/ci/lib/hook-mode.sh` implements, which checks only what the
# session's tree has uncommitted and never exits 2. A check with a `language` carries a
# `[[ -x … ]] || exit 0` guard, so a repo that declined the script skips it silently; the
# secret scan deliberately has none.
#
# This file only ships the hooks dockyard owns. The rest of a Vibe setup — secret-guard,
# the plugin adapters, user-level hooks in ~/.vibe/hooks.toml — is not dockyard's, the way
# `.claude/` session configuration is not dockyard's either.
#
# Received only when the repo declares `vibe` in `[dockyard] harnesses` (or has a `.vibe/`
# directory dockyard detects).

[[hooks]]
name = "dockyard-lint-python"
type = "post_agent"
timeout = 300.0
command = "[[ -x scripts/ci/lint-python.sh ]] || exit 0; scripts/ci/lint-python.sh --hook"
description = "dockyard check `lint-python` in --hook mode (generated by dockyard sync)"

[[hooks]]
name = "dockyard-typecheck-python"
type = "post_agent"
timeout = 300.0
command = "[[ -x scripts/ci/typecheck-python.sh ]] || exit 0; scripts/ci/typecheck-python.sh --hook"
description = "dockyard check `typecheck-python` in --hook mode (generated by dockyard sync)"

