[[pattern]]
id = "rest-json-policy"
rule = "REST/JSON wire containers in crates/** use the container-level policy attribute #[rest_json(...)] (crate rest-json, proc-macro) instead of hand-written #[serde(rename_all = \"camelCase\")] + per-field skip_serializing_if: it must sit ABOVE #[derive(... Serialize, Deserialize ...)] (attribute macros expand outside-in; misplaced = compile error), and it lowers to plain #[serde(...)] attributes. Policy args: rename_all = \"...\" (default camelCase, \"none\" to disable), acronyms(\"URL\", ...) keeps acronym words in full caps (resource_url -> resourceURL), rename(member = \"wire\") is a per-member override, skip_none (default) adds skip_serializing_if = \"Option::is_none\" to every Option field, and any other arg (default, deny_unknown_fields, tag = ...) is forwarded to the emitted container #[serde(...)]. A manual field-level #[serde(rename = ...)] always wins and is left untouched."
applies_to = "every struct/enum serialized to the REST/JSON wire format in crates/**"
when_not_applicable = "non-wire serde types (transparent wrappers, plain enums serialized by variant name, client-side drafts) keep their manual #[serde(...)]; a fully custom fn(&str) -> String rename is not possible at macro-expansion time (serde-rs/serde#2852) — use acronyms(...)/rename(...) or a manual field rename"
scope = "crates/**/*.rs"
message = "wire container should use #[rest_json(...)] above #[derive] instead of repeating rename_all/skip_serializing_if by hand. See crates/rest-json/src/lib.rs docs."
bad_example = """
#[derive(Serialize, Deserialize)]
#[serde(rename_all = "camelCase")]
pub struct Link {
    pub href: String,
    #[serde(default, skip_serializing_if = "Option::is_none")]
    pub rel: Option<String>,
}
"""
good_example = """
#[rest_json]
#[derive(Serialize, Deserialize)]
pub struct Link {
    pub href: String,
    #[serde(default)]
    pub rel: Option<String>,
}
"""
severity = "warning"
exclude_files = []
occurrences = [
  { file = "crates/cpm-core/src/model/{events,folder,imdn,object,search,subscription,sync}.rs", lines = "43 containers migrated to #[rest_json] (acronyms(\"URL\") for resourceURL/notifyURL, rename(...) for wire \"type\" and the RequestErrorKind exception kinds)", since = "branch feat/rest-json-policy" },
]
