# Review known-patterns — cpm-store (see docs/adr/0001-review-known-patterns.md)
#
# Structure of a rule (see .vibe/skills/review-memory-owner):
#   rule              = the GENERALIZATION (the principle, not an isolated case)
#   applies_to        = what it applies to in general
#   when_not_applicable = documented exceptions (never deleted)
#   DETECTION is deterministic code in tools/review-check (AST via syn),
#   not a regex: each id below = one linter rule (like a clippy lint).
#   rule/applies_to/when_not_applicable/bad_example/good_example/occurrences = DOC
#   (debug, LLM reading, tracking) — it does NOT replace the executable rule.
#
# Detection is deliberately BROAD at first (the linter's AST rule matches the principle,
# not a specific object): it is then tightened (scope / when_not_applicable) as
# examples come in. Better one extra warning, dismissed with "does not apply to this
# case", than a missed pattern because the rule was too narrow.
#   occurrences       = all known occurrences (file/lines/since)
#
# Rules:
# - severity = "warning" ONLY (blocking = compiler / tests / clippy -D)
# - NEVER DELETE A RULE: edit/adapt it, or use the per-line valve
#   `// review: ignore <rule-id>`
# - exclude_files locked: additions only with the user's explicit approval
# - warnings stay until the rule or the files are fixed
# - run the check on the ADDED LINES of the diff, not whole files
#
# Exception: an id with no AST rule (e.g. `english-only`) is a doc-only contract —
# the checker skips it; its entry documents where detection actually lives.

[[pattern]]
id = "serde-helper-identity"
rule = "A manual Serialize/Deserialize impl plus a Helper struct is only justified when the JSON shape differs from the internal shape (renaming, merging fields, validation, transformation). If the conversion is a field-by-field copy (identity), put #[serde(default, deserialize_with, rename)] directly on the field and derive instead."
applies_to = "any data struct mapped to/from JSON"
when_not_applicable = "enum/newtype with custom variant mapping (e.g. MessageContext, MetadataFlag): no Helper, a manual impl is legitimate"
scope = "crates/**/*.rs"
message = "manual serde impl + Helper with identity conversion -> derive + #[serde(...)] on the field. See .vibe/skills/serde-mapping-owner."
bad_example = """
impl<'de> Deserialize<'de> for Attribute {
    fn deserialize<D>(d: D) -> Result<Self, D::Error> {
        #[derive(Deserialize)]
        struct Helper { name: String, value: Vec<String> }   // identity copy
        let h = Helper::deserialize(d)?;
        Ok(Attribute { name: h.name, value: h.value })
    }
}
"""
good_example = """
#[derive(Deserialize)]
pub struct Attribute {
    pub name: String,
    #[serde(default, deserialize_with = "super::one_or_many")]
    pub value: Vec<String>,
}
"""
severity = "warning"
exclude_files = []
occurrences = [
  { file = "crates/cpm-core/src/model/attribute.rs", lines = "26-37 and 115-121 (Helper inside an impl method — detected since the helper_in_fn scope adjustment)", since = "PR #3; fixed in PR #12 (review/attribute-list-crate)" },
]

[[pattern]]
id = "manual-serde-impl"
rule = "By default, derive Serialize/Deserialize with field attributes (#[serde(default, deserialize_with, rename, ...)]) — this covers ~95% of cases. A manual impl is only justified for a mapping that attributes cannot express (enum with custom variants, newtype wrapper, custom one_or_many logic)."
applies_to = "any type mapped to JSON"
when_not_applicable = "enums/newtypes with custom variant serialization (kind.rs MessageContext/Direction, flags.rs MetadataFlag/FlagList, search.rs RequestError) — manual impl expected, validated case by case"
scope = "crates/**/*.rs"
message = "manual serde impl: check that derive + field attributes would not be enough. See .vibe/skills/serde-mapping-owner."
bad_example = """
impl<'de> Deserialize<'de> for Foo { /* ... */ }  // no transformation reason
"""
good_example = """
#[derive(Deserialize)]
pub struct Foo {
    #[serde(default, deserialize_with = "super::one_or_many", rename = "fooBar")]
    pub field: Vec<String>,
}
// manual impl reserved for enums/newtypes with custom mapping (e.g. MessageContext)
"""
severity = "warning"
exclude_files = []
occurrences = [
  { file = "crates/cpm-core/src/model/attribute.rs", lines = "23, 103, 112", since = "PR #3; fixed in PR #12 (review/attribute-list-crate)" },
]

[[pattern]]
id = "newtype-pub-with-delegation"
rule = "A newtype picks ONE exposure mode: transparent (pub field, .0 access) OR encapsulated (private field + methods). Never mix: with a pub field, the delegation methods (iter/len/is_empty) are dead code. The inner API is GENERATED via Deref<Target = Inner> (all-or-nothing); a subset is selected with explicit methods or the delegate! macro."
applies_to = "any newtype `struct X(pub Vec<T>)` or collection wrapper"
when_not_applicable = "when an invariant must be checked on insertion (e.g. name uniqueness, REST-NMS §5.3.2.6): private field, no DerefMut"
scope = "crates/**/*.rs"
message = "pub newtype + manual delegations = redundant. Choose Deref (generated API, private field) or pub without delegations. See .vibe/skills/model-struct-owner."
bad_example = """
pub struct AttributeList(pub Vec<Attribute>);   // transparent
impl AttributeList { pub fn len(&self) -> usize { self.0.len() } }  // AND delegations = mixing
"""
good_example = """
pub struct AttributeList { attribute: Vec<Attribute> }   // private field, named struct
impl Deref for AttributeList { type Target = Vec<Attribute>; fn deref(&self) -> &Self::Target { &self.attribute } }
// NO DerefMut: do not expose push/remove, which would violate name uniqueness (REST-NMS §5.3.2.6)
impl From<Vec<Attribute>> for AttributeList { /* ... */ }
"""
severity = "warning"
exclude_files = []
occurrences = [
  { file = "crates/cpm-core/src/model/attribute.rs", lines = "53", since = "PR #3; fixed in PR #12 (review/attribute-list-crate)" },
]

[[pattern]]
id = "manual-delegation-methods"
rule = "Never hand-write a method that is a pure delegation to a newtype's inner: Deref<Target = Inner> automatically provides len/iter/is_empty/get/... (all-or-nothing). For an explicit subset: selected methods or the macro delegate! { len -> usize, ... }."
applies_to = "any newtype/wrapper exposing its inner type's API"
when_not_applicable = "methods with added business logic (e.g. case-insensitive get, §5.3.2.5): writing them by hand is correct"
scope = "crates/**/*.rs"
message = "hand-written method that only delegates to the inner's same-named method -> Deref generates it. See .vibe/skills/model-struct-owner."
bad_example = """
pub fn len(&self) -> usize { self.0.len() }   // hand written
pub fn iter(&self) -> impl Iterator<Item = &T> { self.0.iter() }
"""
good_example = """
impl Deref for X { type Target = Vec<T>; fn deref(&self) -> &Self::Target { &self.0 } }
// x.len(), x.iter() ... available without writing anything
"""
severity = "warning"
exclude_files = []
occurrences = [
  { file = "crates/cpm-core/src/model/attribute.rs", lines = "94, 98, 134-144 (before refactor)", since = "PR #3; fixed in PR #12 (review/attribute-list-crate)" },
]

[[pattern]]
id = "main-rs-thin"
rule = "A main.rs file stays a thin CLI: only `mod x;`, `use`, `fn main` and small CLI fns. Any definition (struct/enum/trait/impl/inline mod) moves to a dedicated module."
applies_to = "any file named main.rs"
when_not_applicable = "tiny binary where everything fits in a few lines (still a warning, dismissed case by case)"
scope = "**/main.rs"
message = "main.rs contains type/logic definitions -> move them to a module (mod x;) and keep main.rs thin. Textbook case: review-check's monolithic main.rs before its split (fix commit b1c0e83)."
severity = "warning"
exclude_files = []
occurrences = [
  { file = "tools/review-check/src/main.rs", lines = "whole file before b1c0e83", since = "review session 2026-11-15, fixed in b1c0e83" },
]

[[pattern]]
id = "duplicate-fn-bodies"
rule = "Two functions/methods with the same body up to an identifier/literal are duplication -> factor out (macro_rules!, trait, or a shared helper). Detection by token normalization (idents -> I, literals -> S) + hash; threshold of 12 tokens to avoid noise."
applies_to = "any .rs file (all free functions and impl methods)"
when_not_applicable = "trivial bodies (< 12 tokens): already covered by manual-delegation-methods; intentional 2-line duplication documented case by case"
scope = "**/*.rs"
message = "duplicated function body (up to a name) -> factor out (macro/trait/helper). Textbook case: message_context()/direction() in attribute.rs (PR #3)."
severity = "warning"
exclude_files = []
occurrences = [
  { file = "crates/cpm-core/src/model/attribute.rs", lines = "122-132 (message_context/direction, before refactor)", since = "PR #3; fixed in PR #12 via macro typed_attribute!" },
]

[[pattern]]
id = "file-sections"
rule = "A .rs file with more than 10 items and no section banner (`// ==== Title ====` for a section, `// ---- Title ----` for a subsection) lacks thematic organization -> split into sections (declarations / constructors / lookup / accessors / serde / tests)."
applies_to = "any substantial .rs file"
when_not_applicable = "files <= 10 items (too small to deserve sections); files with existing banners"
scope = "**/*.rs"
message = "large file without thematic sections (// ==== ... ==== or subsection // ---- ... ----) -> split by theme."
severity = "warning"
exclude_files = []
occurrences = [
  { file = "crates/cpm-core/src/model/attribute.rs", lines = "before refactor (no banners)", since = "PR #3; fixed in PR #12 (review/attribute-list-crate)" },
]

[[pattern]]
id = "thematic-clusters"
rule = "The semantic \"what goes together\" = the intra-file call graph: a function calling another function of the same file creates an edge (union-find). A connected component of >= 3 functions is a thematic group; if it has no banner (`// ====` section or `// ----` subsection) within the 5 lines above it, the file lacks sections -> violation."
applies_to = "any .rs file with several interconnected functions"
when_not_applicable = "clusters already under a section banner; isolated orphan functions (size < 3)"
scope = "**/*.rs"
message = "cluster of functions linked by calls (intra-file graph) without a banner (// ==== or // ----) above -> create a thematic section. E.g. get->values->first_value->message_context (attribute.rs PR #3)."
severity = "warning"
exclude_files = []
occurrences = [
  { file = "crates/cpm-core/src/model/attribute.rs", lines = "60-132 (lookup + typed accessors, before refactor)", since = "PR #3; fixed in PR #12 (review/attribute-list-crate)" },
]

[[pattern]]
id = "closure-params-typed"
rule = "Closure parameters always carry an explicit type (|a: &&Attribute|), even when the compiler infers it: PR diffs are read without IDE hover, and combinators like Iterator::find hand out double references (&&T) that are easy to misread in a raw diff."
applies_to = "every closure in the repo (crates/**, tools/**)"
when_not_applicable = "wildcard param |_| (no binding to type)"
scope = "**/*.rs"
message = "untyped closure parameter -> annotate it (|a: &T|). See AGENTS.md 'Language and style'."
bad_example = """
self.iter().find(|a| a.name.eq_ignore_ascii_case(name))
"""
good_example = """
self.iter().find(|a: &&Attribute| a.name.eq_ignore_ascii_case(name))
"""
severity = "warning"
exclude_files = []
occurrences = [
  { file = "crates/cpm-core/src/model/attribute.rs", lines = "90, 95, 101", since = "branch review/pr8-remaining" },
  { file = "crates/cpm-core/src/model/flags.rs", lines = "175, 189", since = "branch review/pr8-remaining" },
  { file = "crates/cpm-core/src/model/kind.rs", lines = "175, 202", since = "branch review/pr8-remaining" },
  { file = "crates/cpm-core/src/model/mod.rs", lines = "199", since = "branch review/pr8-remaining" },
  { file = "crates/cpm-core/src/model/sync.rs", lines = "46, 53, 64", since = "branch review/pr8-remaining" },
  { file = "crates/cpm-core/tests/golden_annexes.rs", lines = "68, 78, 83, 245, 298, 312", since = "branch review/pr8-remaining" },
  { file = "crates/cpm-core/tests/ports_mock.rs", lines = "57, 81, 90, 91", since = "branch review/pr8-remaining" },
  { file = "tools/review-check/src", lines = "all closures in checker.rs, main.rs, report.rs, rules/*.rs", since = "branch review/pr8-remaining" },
]

[[pattern]]
id = "english-only"
rule = "All repository content is English: code, identifiers, comments (/// and //), docs, README, AGENTS.md, commit messages, PR titles/descriptions, CI scripts. French is only allowed in chat responses to the maintainer (user-level rule, not a repo rule). Detection is lexical, not AST, so it does NOT live in this linter: it is enforced by scripts/ci/check-language.py (pre-commit hook 'language', blocking CI job 'language (English-only added lines)', Vibe hooks 'language-pre-write' and 'language-post-agent'), which scans the lines ADDED by each change in every file type (.rs, .md, .toml, .yml, ...). This entry is the documented contract; the checker skips it (no AST rule with this id)."
applies_to = "every added line of every file type"
when_not_applicable = "generated/vendored files (**/Cargo.lock, docs/TREE.md, reports/**); pre-existing French lines — the check scans added lines only, existing docs are translated as they are touched"
scope = "**/*"  # unused: doc-only entry, the checker skips it (no AST rule with this id)
message = "n/a — enforced by scripts/ci/check-language.py, not by review-check"
severity = "warning"
exclude_files = []
occurrences = [
  { file = "crates/cpm-core/src/model/{attribute,flags,search,mod}.rs, crates/cpm-core/tests/ports_mock.rs", lines = "French comments translated to English", since = "English-only pass on branch review/pr8-remaining" },
]

[[pattern]]
id = "serde-redundant-attr"
rule = "Field/variant-level #[serde(...)] attributes vs the container-level one: (A) rename = \"X\" where X equals what the container's rename_all produces for that ident (or equals the ident itself without rename_all) is REDUNDANT -> remove it; (B) alias = \"X\" where X equals the effective wire name is redundant; (C) a bare field-level default when the container already has default is dead (container default wins) -> remove it; (D) a rename that is NOT redundant (differs from the rename_all output, e.g. the wire acronym resourceURL where camelCase gives resourceUrl) is load-bearing and MUST be explained by a comment: a trailing // on the attribute line (#[serde(rename = \"resourceURL\")] // wire ...), the line right after it when rustfmt wrapped a long trailing comment there, or a /// doc on the member — without it the next reader assumes it duplicates rename_all and deletes it. Detection computes serde's RenameRule exactly (field vs variant context), it does not pattern-match. A container annotated with #[rest_json(...)] (crate rest-json) counts as the container-level attribute: implicit rename_all = \"camelCase\", acronyms(\"URL\", ...) applied on top of the rule, and a rename(...) map entry is a rule-D-documented rename."
applies_to = "every struct/enum with #[serde(...)] attributes in crates/**"
when_not_applicable = "default = \"path\" (custom default fn) is never flagged, only a bare default under a container default; a rename equal to the rename_all output is rule A (remove), never rule D (document)"
scope = "crates/**/*.rs"
message = "rule A/B/C: redundant serde attribute, remove the field/variant-level one. rule D: load-bearing rename (wire acronym like resourceURL) -> add a /// comment on the member explaining the wire name. See .vibe/skills/serde-mapping-owner."
bad_example = """
#[serde(rename_all = "camelCase", default)]
struct SelectionCriteria {
    #[serde(default)]
    pub max_entries: u32,
}
"""
good_example = """
#[serde(rename_all = "camelCase", default)]
struct SelectionCriteria {
    pub max_entries: u32,   // missing field comes from the container default
}
"""
severity = "warning"
exclude_files = []
occurrences = [
  { file = "crates/cpm-core/src/model/search.rs", lines = "112, 119-123, 127-131, 289-293 (bare default under container default)", since = "branch review/pr8-remaining, fixed" },
  { file = "crates/cpm-core/src/model/events.rs", lines = "132, 137-141", since = "branch review/pr8-remaining, fixed" },
  { file = "crates/cpm-core/src/model/folder.rs", lines = "100-104, 126, 136", since = "branch review/pr8-remaining, fixed" },
  { file = "crates/cpm-core/src/model/imdn.rs", lines = "40-44", since = "branch review/pr8-remaining, fixed" },
  { file = "crates/cpm-core/src/model/object.rs", lines = "37-41, 99-103, 140", since = "branch review/pr8-remaining, fixed" },
  { file = "crates/cpm-core/src/model/subscription.rs", lines = "70", since = "branch review/pr8-remaining, fixed" },
  { file = "crates/cpm-core/src/model/events.rs", lines = "NmsEvent variants 110-122: rename_all = camelCase added to the enum, 7 variant renames removed as redundant (wire format unchanged, golden tests green)", since = "branch review/pr8-remaining, fixed" },
  { file = "crates/cpm-core/src/model/folder.rs", lines = "40, 52: rename folderReference/objectReference == camelCase(field) -> removed as redundant (rule A)", since = "branch review/pr8-remaining, fixed" },
  { file = "crates/cpm-core/src/model/{events,folder,imdn,search,subscription}.rs", lines = "15 explicit renames (resourceURL x9, notifyURL, type x3, policyException/serviceException variants) carry a // wire-name comment on the attribute line or the wrapped next line (rule D)", since = "branch review/pr8-remaining, fixed" },
  { file = "crates/cpm-core/src/model/folder.rs", lines = "FolderReferenceList/ObjectReferenceList: rename_all = camelCase added to the containers, field renames and bare defaults removed (wire keys folderReference/objectReference unchanged)", since = "branch review/pr8-remaining, fixed" },
