# Known-patterns de review — cpm-store (voir docs/adr/0001-review-known-patterns.md)
#
# Structure d'une règle (voir .vibe/skills/review-memory-owner) :
#   rule              = la GÉNÉRALISATION (le principe, pas un cas isolé)
#   applies_to        = à quoi ça s'applique en général
#   when_not_applicable = exceptions documentées (jamais supprimées)
#   La DÉTECTION est du code déterministe dans tools/review-check (AST via syn),
#   pas une regex : chaque id ci-dessous = une fonction du linter (comme un lint clippy).
#   rule/applies_to/when_not_applicable/bad_example/good_example/occurrences = DOC
#   (debug, lecture LLM, suivi) — ne remplace PAS la règle exécutable.
#
# Détection volontairement LARGE au début (la règle AST du linter matche le principe,
# pas un objet précis) : on resserre ensuite (scope / when_not_applicable) au fil des
# exemples. Mieux vaut un warning de trop, qu'on écarte en disant « ne s'applique pas à ce
# cas », qu'un pattern manqué parce que la règle était trop étroite.
#   occurrences       = toutes les occurrences connues (file/lines/since)
#
# Règles :
# - severity = "warning" UNIQUEMENT (bloquant = compilateur / tests / clippy -D)
# - ON NE SUPPRIME JAMAIS UNE RÈGLE : on l'édite/adapte, ou soupape par ligne
#   `// review: ignore <rule-id>`
# - exclude_files verrouillé : ajout uniquement avec accord explicite de l'utilisateur
# - les warnings restent jusqu'à ce que la règle ou les fichiers soient fixés
# - lancer le check sur les LIGNES AJOUTÉES du diff, pas les fichiers entiers
#
# Exception: an id with no AST rule (e.g. `english-only`) is a doc-only contract —
# the checker skips it; its entry documents where detection actually lives.

[[pattern]]
id = "serde-helper-identity"
rule = "Un impl Serialize/Deserialize manuel + struct Helper n'est justifié que quand la forme JSON diffère de la forme interne (renommage, fusion de champs, validation, transformation). Si la conversion est une recopie champ à champ (identité), poser #[serde(default, deserialize_with, rename)] directement sur le champ et dériver."
applies_to = "toute struct data mappée depuis/vers du JSON"
when_not_applicable = "enum/newtype avec mapping custom de variantes (ex. MessageContext, MetadataFlag) : pas de Helper, impl manuel légitime"
scope = "crates/**/*.rs"
message = "impl serde manuel + Helper avec conversion identité -> derive + #[serde(...)] sur le champ. Voir .vibe/skills/serde-mapping-owner."
bad_example = """
impl<'de> Deserialize<'de> for Attribute {
    fn deserialize<D>(d: D) -> Result<Self, D::Error> {
        #[derive(Deserialize)]
        struct Helper { name: String, value: Vec<String> }   // recopie identité
        let h = Helper::deserialize(d)?;
        Ok(Attribute { name: h.name, value: h.value })
    }
}
"""
good_example = """
#[derive(Deserialize)]
pub struct Attribute {
    pub name: String,
    #[serde(default, deserialize_with = "super::one_or_many")]
    pub value: Vec<String>,
}
"""
severity = "warning"
exclude_files = []
occurrences = [
  { file = "crates/cpm-core/src/model/attribute.rs", lines = "26-37 et 115-121 (Helper dans méthode d'impl — détecté depuis l'ajustement du périmètre helper_in_fn)", since = "PR #3; fixed in PR #12 (review/attribute-list-crate)" },
]

[[pattern]]
id = "manual-serde-impl"
rule = "Par défaut, dériver Serialize/Deserialize avec des attributs champ (#[serde(default, deserialize_with, rename, ...)]) couvre ~95% des cas. Un impl manuel ne se justifie que pour un mapping non exprimable par les attributs (enum à variantes custom, newtype enveloppe, logique one_or_many custom)."
applies_to = "tout type mappé en JSON"
when_not_applicable = "enums/newtypes avec sérialisation custom de variantes (kind.rs MessageContext/Direction, flags.rs MetadataFlag/FlagList, search.rs RequestError) — impl manuel attendu, à valider au cas par cas"
scope = "crates/**/*.rs"
message = "impl serde manuel : vérifier qu'un derive + attributs champ ne suffit pas. Voir .vibe/skills/serde-mapping-owner."
bad_example = """
impl<'de> Deserialize<'de> for Foo { /* ... */ }  // sans raison de transformation
"""
good_example = """
#[derive(Deserialize)]
pub struct Foo {
    #[serde(default, deserialize_with = "super::one_or_many", rename = "fooBar")]
    pub field: Vec<String>,
}
// impl manuel réservé aux enums/newtypes à mapping custom (ex. MessageContext)
"""
severity = "warning"
exclude_files = []
occurrences = [
  { file = "crates/cpm-core/src/model/attribute.rs", lines = "23, 103, 112", since = "PR #3; fixed in PR #12 (review/attribute-list-crate)" },
]

[[pattern]]
id = "newtype-pub-with-delegation"
rule = "Un newtype choisit UN mode d'exposition : transparent (champ pub, accès .0) OU encapsulé (champ privé + méthodes). Ne jamais mélanger : avec un champ pub, les méthodes de délégation (iter/len/is_empty) sont mortes. L'API de l'inner se GÉNÈRE par Deref<Target = Inner> (tout-ou-rien) ; un sous-ensemble se choisit par méthodes écrites ou macro delegate!."
applies_to = "tout newtype `struct X(pub Vec<T>)` ou wrapper de collection"
when_not_applicable = "quand un invariant doit être vérifié à l'insertion (ex. unicité des noms REST-NMS §5.3.2.6) : champ privé, pas de DerefMut"
scope = "crates/**/*.rs"
message = "newtype pub + délégations manuelles = redondant. Choisir Deref (API générée, champ privé) ou pub sans délégations. Voir .vibe/skills/model-struct-owner."
bad_example = """
pub struct AttributeList(pub Vec<Attribute>);   // transparent
impl AttributeList { pub fn len(&self) -> usize { self.0.len() } }  // ET délégations = mélange
"""
good_example = """
pub struct AttributeList { attribute: Vec<Attribute> }   // champ privé, struct nommée
impl Deref for AttributeList { type Target = Vec<Attribute>; fn deref(&self) -> &Self::Target { &self.attribute } }
// PAS de DerefMut : ne pas exposer push/remove qui violent l'unicité des noms (REST-NMS §5.3.2.6)
impl From<Vec<Attribute>> for AttributeList { /* ... */ }
"""
severity = "warning"
exclude_files = []
occurrences = [
  { file = "crates/cpm-core/src/model/attribute.rs", lines = "53", since = "PR #3; fixed in PR #12 (review/attribute-list-crate)" },
]

[[pattern]]
id = "manual-delegation-methods"
rule = "Ne jamais écrire à la main une méthode qui est une pure délégation vers l'inner d'un newtype : Deref<Target = Inner> génère automatiquement len/iter/is_empty/get/... (tout-ou-rien). Pour un sous-ensemble explicite : méthodes choisies ou macro delegate! { len -> usize, ... }."
applies_to = "tout newtype/wrapper qui expose l'API de son type interne"
when_not_applicable = "méthodes avec logique métier ajoutée (ex. get case-insensitive §5.3.2.5) : les écrire à la main est correct"
scope = "crates/**/*.rs"
message = "méthode réécrite à la main qui ne fait que déléguer à la méthode de même nom de l'inner -> Deref la génère. Voir .vibe/skills/model-struct-owner."
bad_example = """
pub fn len(&self) -> usize { self.0.len() }   // réécrit à la main
pub fn iter(&self) -> impl Iterator<Item = &T> { self.0.iter() }
"""
good_example = """
impl Deref for X { type Target = Vec<T>; fn deref(&self) -> &Self::Target { &self.0 } }
// x.len(), x.iter() ... disponibles sans rien écrire
"""
severity = "warning"
exclude_files = []
occurrences = [
  { file = "crates/cpm-core/src/model/attribute.rs", lines = "94, 98, 134-144 (avant refactor)", since = "PR #3; fixed in PR #12 (review/attribute-list-crate)" },
]

[[pattern]]
id = "main-rs-thin"
rule = "Un fichier main.rs reste un CLI mince : uniquement `mod x;`, `use`, `fn main` et petites fns CLI. Toute définition (struct/enum/trait/impl/mod inline) part dans un module dédié."
applies_to = "tout fichier nommé main.rs"
when_not_applicable = "binaire minuscule où tout tient en quelques lignes (reste un warning, à écarter au cas par cas)"
scope = "**/main.rs"
message = "main.rs contient des définitions de types/logique -> déplacer dans un module (mod x;) et garder main.rs mince. Cas d'école : le main.rs monolithique de review-check avant son découpage (fix commit b1c0e83)."
severity = "warning"
exclude_files = []
occurrences = [
  { file = "tools/review-check/src/main.rs", lines = "tout le fichier avant b1c0e83", since = "session review 2026-11-15, fixed in b1c0e83" },
]

[[pattern]]
id = "duplicate-fn-bodies"
rule = "Deux fonctions/méthodes avec le même corps à un identifiant/literal près sont de la duplication -> factoriser (macro_rules!, trait, ou helper partagé). Détection par normalisation des tokens (idents -> I, literals -> S) + hash; seuil 12 tokens pour éviter le bruit."
applies_to = "tout fichier .rs (toutes fonctions libres et méthodes d'impl)"
when_not_applicable = "corps triviaux (< 12 tokens) : déjà couvert par manual-delegation-methods ; duplication intentionnelle de 2 lignes documentée au cas par cas"
scope = "**/*.rs"
message = "corps de fonction dupliqué (à un nom près) -> factoriser (macro/trait/helper). Cas d'école: message_context()/direction() dans attribute.rs (PR #3)."
severity = "warning"
exclude_files = []
occurrences = [
  { file = "crates/cpm-core/src/model/attribute.rs", lines = "122-132 (message_context/direction, avant refactor)", since = "PR #3; fixed in PR #12 via macro typed_attribute!" },
]

[[pattern]]
id = "file-sections"
rule = "Un fichier .rs de plus de 10 items sans aucune bannière de section (`// ==== Titre ====` pour une section, `// ---- Titre ----` pour une sous-section) manque d'organisation thématique -> découper en sections (déclaration / constructeurs / lookup / accesseurs / serde / tests)."
applies_to = "tout fichier .rs conséquent"
when_not_applicable = "fichiers <= 10 items (trop petits pour mériter des sections) ; fichiers avec bannières existantes"
scope = "**/*.rs"
message = "fichier volumineux sans sections thématiques (// ==== ... ==== ou sous-section // ---- ... ----) -> découper par thème."
severity = "warning"
exclude_files = []
occurrences = [
  { file = "crates/cpm-core/src/model/attribute.rs", lines = "avant refactor (pas de bannières)", since = "PR #3; fixed in PR #12 (review/attribute-list-crate)" },
]

[[pattern]]
id = "thematic-clusters"
rule = "Le sémantique « qui va ensemble » = le graphe d'appels intra-fichier : une fonction qui appelle une autre fonction du même fichier crée une arête (union-find). Une composante connexe de >= 3 fonctions est un groupe thématique ; s'il n'a pas de bannière (`// ====` section ou `// ----` sous-section) dans les 5 lignes au-dessus, le fichier manque de sections -> violation."
applies_to = "tout fichier .rs avec plusieurs fonctions interconnectées"
when_not_applicable = "clusters déjà sous une bannière de section ; fonctions orphelines isolées (taille < 3)"
scope = "**/*.rs"
message = "cluster de fonctions liées par appels (graphe intra-fichier) sans bannière (// ==== ou // ----) au-dessus -> créer une section thématique. Ex: get->values->first_value->message_context (attribute.rs PR #3)."
severity = "warning"
exclude_files = []
occurrences = [
  { file = "crates/cpm-core/src/model/attribute.rs", lines = "60-132 (lookup + accesseurs typés, avant refactor)", since = "PR #3; fixed in PR #12 (review/attribute-list-crate)" },
]

[[pattern]]
id = "closure-params-typed"
rule = "Closure parameters always carry an explicit type (|a: &&Attribute|), even when the compiler infers it: PR diffs are read without IDE hover, and combinators like Iterator::find hand out double references (&&T) that are easy to misread in a raw diff."
applies_to = "every closure in the repo (crates/**, tools/**)"
when_not_applicable = "wildcard param |_| (no binding to type)"
scope = "**/*.rs"
message = "untyped closure parameter -> annotate it (|a: &T|). See AGENTS.md 'Language and style'."
bad_example = """
self.iter().find(|a| a.name.eq_ignore_ascii_case(name))
"""
good_example = """
self.iter().find(|a: &&Attribute| a.name.eq_ignore_ascii_case(name))
"""
severity = "warning"
exclude_files = []
occurrences = [
  { file = "crates/cpm-core/src/model/attribute.rs", lines = "90, 95, 101", since = "branch review/pr8-remaining" },
  { file = "crates/cpm-core/src/model/flags.rs", lines = "175, 189", since = "branch review/pr8-remaining" },
  { file = "crates/cpm-core/src/model/kind.rs", lines = "175, 202", since = "branch review/pr8-remaining" },
  { file = "crates/cpm-core/src/model/mod.rs", lines = "199", since = "branch review/pr8-remaining" },
  { file = "crates/cpm-core/src/model/sync.rs", lines = "46, 53, 64", since = "branch review/pr8-remaining" },
  { file = "crates/cpm-core/tests/golden_annexes.rs", lines = "68, 78, 83, 245, 298, 312", since = "branch review/pr8-remaining" },
  { file = "crates/cpm-core/tests/ports_mock.rs", lines = "57, 81, 90, 91", since = "branch review/pr8-remaining" },
  { file = "tools/review-check/src", lines = "all closures in checker.rs, main.rs, report.rs, rules/*.rs", since = "branch review/pr8-remaining" },
]

[[pattern]]
id = "english-only"
rule = "All repository content is English: code, identifiers, comments (/// and //), docs, README, AGENTS.md, commit messages, PR titles/descriptions, CI scripts. French is only allowed in chat responses to the maintainer (user-level rule, not a repo rule). Detection is lexical, not AST, so it does NOT live in this linter: it is enforced by scripts/ci/check-language.py (pre-commit hook 'language', blocking CI job 'language (English-only added lines)', Vibe hooks 'language-pre-write' and 'language-post-agent'), which scans the lines ADDED by each change in every file type (.rs, .md, .toml, .yml, ...). This entry is the documented contract; the checker skips it (no AST rule with this id)."
applies_to = "every added line of every file type"
when_not_applicable = "generated/vendored files (**/Cargo.lock, docs/TREE.md, reports/**); pre-existing French lines — the check scans added lines only, existing docs are translated as they are touched"
scope = "**/*"  # unused: doc-only entry, the checker skips it (no AST rule with this id)
message = "n/a — enforced by scripts/ci/check-language.py, not by review-check"
severity = "warning"
exclude_files = []
occurrences = [
  { file = "crates/cpm-core/src/model/{attribute,flags,search,mod}.rs, crates/cpm-core/tests/ports_mock.rs", lines = "French comments translated to English", since = "English-only pass on branch review/pr8-remaining" },
]

[[pattern]]
id = "serde-redundant-attr"
rule = "Field/variant-level #[serde(...)] attributes vs the container-level one: (A) rename = \"X\" where X equals what the container's rename_all produces for that ident (or equals the ident itself without rename_all) is REDUNDANT -> remove it; (B) alias = \"X\" where X equals the effective wire name is redundant; (C) a bare field-level default when the container already has default is dead (container default wins) -> remove it; (D) a rename that is NOT redundant (differs from the rename_all output, e.g. the wire acronym resourceURL where camelCase gives resourceUrl) is load-bearing and MUST be explained by a comment: a trailing // on the attribute line (#[serde(rename = \"resourceURL\")] // wire ...), the line right after it when rustfmt wrapped a long trailing comment there, or a /// doc on the member — without it the next reader assumes it duplicates rename_all and deletes it. Detection computes serde's RenameRule exactly (field vs variant context), it does not pattern-match. A container annotated with #[rest_json(...)] (crate rest-json) counts as the container-level attribute: implicit rename_all = \"camelCase\", acronyms(\"URL\", ...) applied on top of the rule, and a rename(...) map entry is a rule-D-documented rename."
applies_to = "every struct/enum with #[serde(...)] attributes in crates/**"
when_not_applicable = "default = \"path\" (custom default fn) is never flagged, only a bare default under a container default; a rename equal to the rename_all output is rule A (remove), never rule D (document)"
scope = "crates/**/*.rs"
message = "rule A/B/C: redundant serde attribute, remove the field/variant-level one. rule D: load-bearing rename (wire acronym like resourceURL) -> add a /// comment on the member explaining the wire name. See .vibe/skills/serde-mapping-owner."
bad_example = """
#[serde(rename_all = "camelCase", default)]
struct SelectionCriteria {
    #[serde(default)]
    pub max_entries: u32,
}
"""
good_example = """
#[serde(rename_all = "camelCase", default)]
struct SelectionCriteria {
    pub max_entries: u32,   // missing field comes from the container default
}
"""
severity = "warning"
exclude_files = []
occurrences = [
  { file = "crates/cpm-core/src/model/search.rs", lines = "112, 119-123, 127-131, 289-293 (bare default under container default)", since = "branch review/pr8-remaining, fixed" },
  { file = "crates/cpm-core/src/model/events.rs", lines = "132, 137-141", since = "branch review/pr8-remaining, fixed" },
  { file = "crates/cpm-core/src/model/folder.rs", lines = "100-104, 126, 136", since = "branch review/pr8-remaining, fixed" },
  { file = "crates/cpm-core/src/model/imdn.rs", lines = "40-44", since = "branch review/pr8-remaining, fixed" },
  { file = "crates/cpm-core/src/model/object.rs", lines = "37-41, 99-103, 140", since = "branch review/pr8-remaining, fixed" },
  { file = "crates/cpm-core/src/model/subscription.rs", lines = "70", since = "branch review/pr8-remaining, fixed" },
  { file = "crates/cpm-core/src/model/events.rs", lines = "NmsEvent variants 110-122: rename_all = camelCase added to the enum, 7 variant renames removed as redundant (wire format unchanged, golden tests green)", since = "branch review/pr8-remaining, fixed" },
  { file = "crates/cpm-core/src/model/folder.rs", lines = "40, 52: rename folderReference/objectReference == camelCase(field) -> removed as redundant (rule A)", since = "branch review/pr8-remaining, fixed" },
  { file = "crates/cpm-core/src/model/{events,folder,imdn,search,subscription}.rs", lines = "15 explicit renames (resourceURL x9, notifyURL, type x3, policyException/serviceException variants) carry a // wire-name comment on the attribute line or the wrapped next line (rule D)", since = "branch review/pr8-remaining, fixed" },
  { file = "crates/cpm-core/src/model/folder.rs", lines = "FolderReferenceList/ObjectReferenceList: rename_all = camelCase added to the containers, field renames and bare defaults removed (wire keys folderReference/objectReference unchanged)", since = "branch review/pr8-remaining, fixed" },
