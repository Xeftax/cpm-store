# cargo-deny — licences, advisories (RUSTSEC), doublons de versions.
# Ajouté suite au LLM council du 2026-11-08 (recommandation Outsider/Contrarian) :
# garantir que l'arbre de dépendances RESTE compatible avec le host
# (linphone-sdk, GPLv3/AGPL) et sans vulnérabilité connue.
# Config compatible cargo-deny 0.20 (allow-osi-fsf-free/unlicensed supprimés, PR #611).

[licenses]
# deny-list : on bloque le copyleft et les licences à problème ; tout licence
# permissive (MIT, Apache-2.0, ISC, BSD, Zlib, Unicode-3.0, Unlicense, BSL-1.0,
# CDLA-Permissive-2.0, ...) est autorisée sans avoir à l'énumérer.
deny = [
  "AGPL-3.0", "GPL-2.0", "GPL-3.0",
  "LGPL-2.0", "LGPL-2.1", "LGPL-3.0",
  "SSPL-1.0", "BUSL-1.1", "Elastic-2.0", "MS-RL",
  "CC-BY-3.0", "CC-BY-4.0", "CC-BY-SA-3.0", "CC-BY-SA-4.0", "CC-BY-ND-4.0",
]
confidence-threshold = 0.8

[advisories]
# toute vulnérabilité RUSTSEC connue fait échouer la CI (comportement par défaut)

[bans]
multiple-versions = "warn"
