# cargo-deny — licences, advisories (RUSTSEC), doublons de versions.
# Objectif (LLM council 2026-11-08) : l'arbre de dépendances RESTE compatible avec
# le host (linphone-sdk, GPLv3/AGPL) et sans vulnérabilité connue.
#
# Migré pour cargo-deny >= 0.16 : la clé [licenses] deny a été supprimée (PR #611),
# toute licence non listée dans `allow` est refusée par défaut.
# Ce fichier est en `decline` dans dockyard.toml (généré par dockyard sinon).

[licenses]
# allow-list : seules ces licences permissives passent ; le copyleft (GPL/AGPL/LGPL),
# SSPL, BUSL, Elastic-2.0, MS-RL, CC-BY*, etc. sont refusés par défaut.
allow = [
  "MIT", "MIT-0", "Apache-2.0", "ISC",
  "BSD-2-Clause", "BSD-3-Clause", "0BSD",
  "Zlib", "Unicode-3.0", "Unlicense", "CC0-1.0",
  "BSL-1.0", "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[advisories]
# toute vulnérabilité RUSTSEC connue fait échouer la CI (comportement par défaut)

[bans]
multiple-versions = "warn"
