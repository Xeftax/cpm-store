# cargo-deny — licenses, advisories (RUSTSEC), duplicate versions.
# Goal (LLM council 2026-11-08): the dependency tree STAYS compatible with the
# host (linphone-sdk, GPLv3/AGPL) and free of known vulnerabilities.
#
# Migrated for cargo-deny >= 0.16: the [licenses] deny key was removed (PR #611),
# so every license not listed in `allow` is denied by default.
# This file is in `decline` in dockyard.toml (otherwise generated by dockyard).

[licenses]
# allow-list: only these permissive licenses pass; copyleft (GPL/AGPL/LGPL),
# SSPL, BUSL, Elastic-2.0, MS-RL, CC-BY*, etc. are denied by default.
allow = [
  "MIT", "MIT-0", "Apache-2.0", "ISC",
  "BSD-2-Clause", "BSD-3-Clause", "0BSD",
  "Zlib", "Unicode-3.0", "Unlicense", "CC0-1.0",
  "BSL-1.0", "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[advisories]
# every known RUSTSEC vulnerability fails CI (default behavior)

[bans]
multiple-versions = "warn"
