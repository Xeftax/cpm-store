[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Core: serialization, errors, time, ids
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
# Async / HTTP (cpm-nms)
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
# MIME / CPIM (cpm-msg)
mail-parser = "0.11"
# Traits async (cpm-client)
async-trait = "0.1"
# Tests (mock NMS server)
wiremock = "0.6"
# FFI header generation (cpm-ffi)
cbindgen = "0.29"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
