[package]
name = "cpm-core"
description = "Core data model for OMA CPM (Converged Personal Messaging): NMS objects, folders, flags, CPM object kinds. Pure crate: no I/O, no unsafe."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
# Object-safe async traits for the ports (dyn-compat needed for the future
# C vtable of the host ports in cpm-ffi, ADR D5).
async-trait = { workspace = true }

[dev-dependencies]
# Test-only async runtime for the ports mock; the lib itself stays runtime-free.
tokio = { workspace = true }

[lints]
workspace = true
