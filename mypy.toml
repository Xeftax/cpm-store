# MyPy configuration — this repo's own (declined from dockyard: cpm-store has no
# src/ layout; the checked trees are tools/ and scripts/, reached via `.` on the
# command line in scripts/ci/typecheck-python.sh).

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "tools,scripts"
exclude = [
    "(^|/)\\.venv/",
    "(^|/)\\.claude/worktrees/",
    "(^|/)build/",
    "(^|/)dist/",
]

# gitlint is untyped upstream; scripts/ci/gitlint_rules.py only needs its API surface.
[[tool.mypy.overrides]]
module = "gitlint.*"
ignore_missing_imports = true

# The custom rule subclasses gitlint's CommitRule, which is Any under the override
# above; strict's disallow_subclassing_any would reject the only extension point
# gitlint offers. Scoped to this one module (both resolutions mypy uses: direct file
# target resolves to `gitlint_rules`, the full-tree `.` walk to `ci.gitlint_rules`).
[[tool.mypy.overrides]]
module = ["gitlint_rules", "ci.gitlint_rules"]
disallow_subclassing_any = false
