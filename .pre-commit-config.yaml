# Pre-commit configuration - managed by dockyard
# Do not edit manually - changes will be overwritten on sync, except inside a
# dockyard:keep region you open (a local hook goes at the end of the last `- repo: local`
# list).
#
# The FIRST entry of `repos:` is generated by `dockyard sync`: one hook per check with a
# non-off `pre-commit` mode in `dockyard.base.toml` + `dockyard.toml`, each running the
# check's `command` exactly as CI does, with no argument of its own — a script that
# behaves differently on a developer's machine decides so itself (`secret-scan.sh` scans
# the staged changes, `lint-python.sh` fixes). `types:`/`types_or:` derive from the
# check's language, so a hook fires only when a file of that language is staged, then
# checks the whole project.
#
# Every hook with a language carries a `[[ -x … ]] || exit 0` guard: a repo that declined
# the shared script would otherwise have pre-commit fail to resolve a missing executable.
# The secret scan deliberately has none — measured, with the script present but not
# executable, `pre-commit run gitleaks` reported **Passed** having scanned nothing. A
# style gate that goes quiet costs a review comment; a secret scan that goes quiet is the
# failure it exists to prevent.
#
# Everything after the first entry is shared content: tools rather than checks.

repos:
- repo: local
  hooks:
  - id: lint-rust
    name: lint-rust
    entry: "bash -c '[[ -x scripts/ci/lint-rust.sh ]] || exit 0; scripts/ci/lint-rust.sh'"
    language: system
    stages: [ pre-commit ]
    types: [ rust ]
    pass_filenames: false

  - id: security-rust
    name: security-rust
    entry: "bash -c '[[ -x scripts/ci/security-rust.sh ]] || exit 0; scripts/ci/security-rust.sh'"
    language: system
    stages: [ pre-commit ]
    types: [ rust ]
    pass_filenames: false

  - id: gitleaks
    name: gitleaks
    entry: "bash -c scripts/ci/secret-scan.sh"
    language: system
    stages: [ pre-commit ]
    pass_filenames: false

  - id: skill-frontmatter
    name: skill-frontmatter
    entry: "bash -c scripts/ci/check_skill_frontmatter.py"
    language: system
    stages: [ pre-commit ]
    files: '^\.claude/skills/'
    pass_filenames: false

- repo: local
  hooks:
  # Markdown is not a language section: every repo has a README, whatever it is written
  # in.
  #
  # The three plugins are not optional. Bare mdformat is a different formatter: it
  # rewrites GFM tables and front matter the plugins leave alone, so a hook without them
  # and a local `mdformat` with them disagree on the same file and hand it back and forth
  # forever. Measured before they were pinned: bare saw 14 unformatted files, the plugin
  # set saw 4. The invocation carried no version constraint at all, which left the same
  # disagreement one release away — `scripts/ci/format-markdown.sh` owns the versions now.
  - id: mdformat
    name: mdformat
    description: "Format Markdown files"
    entry: bash -c '[[ -x scripts/ci/format-markdown.sh ]] || exit 0; exec scripts/ci/format-markdown.sh "$@"' --
    language: system
    stages: [ pre-commit ]
    types: [ markdown ]

# Global settings
default_stages: [ pre-commit ]
fail_fast: false
